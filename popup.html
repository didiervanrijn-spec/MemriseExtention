<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      padding: 14px;
      font-family: sans-serif;
      text-align: center;
      background-color: #181825;
      color: #cdd6f4;
    }
    h4 {
      margin: 0 0 10px 0;
      color: #89b4fa;
    }
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #313244;
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 10px;
    }
    /* Switch Styling */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #f38ba8;
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #11111b;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #a6e3a1;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
    #status-label {
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h4>Memrise Engine</h4>
  <div class="toggle-container">
    <span id="status-label">Status: UIT</span>
    <label class="switch">
      <input type="checkbox" id="extension-toggle">
      <span class="slider"></span>
    </label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
